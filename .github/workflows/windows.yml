name: Windows build

# Run on demand (Actions tab → Windows build → Run workflow) to get a test installer as a
# build artifact. On a version tag like v0.2.0 it also uploads the installer and update
# metadata to the draft GitHub Release for that version (see README → Releasing).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # lets azure/login sign in with OIDC

jobs:
  build:
    runs-on: windows-latest
    # The Azure federated credential trusts this environment, not a branch or tag.
    environment: release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1
          fi

      # Code signing with Azure Artifact Signing (formerly Trusted Signing). GitHub signs in
      # to Azure with a federated credential (OIDC) on the "release" environment, so no
      # secret is stored here. Set these repository variables to turn it on:
      #   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID   the app registration
      #   AZURE_SIGNING_ENDPOINT       e.g. https://eus.codesigning.azure.net/
      #   AZURE_SIGNING_ACCOUNT        the Artifact Signing account name
      #   AZURE_SIGNING_PROFILE        the certificate profile name
      #   AZURE_SIGNING_PUBLISHER      the certificate's subject CN; installed apps only
      #                                accept updates signed with this name
      # Without them the installer is built unsigned.
      - name: Sign in to Azure
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build installer
        shell: bash
        env:
          SIGN: ${{ vars.AZURE_CLIENT_ID != '' }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          npm run build
          if [ "$SIGN" = "true" ]; then
            npx electron-builder --win --x64 --publish never \
              -c.win.azureSignOptions.endpoint="$ENDPOINT" \
              -c.win.azureSignOptions.codeSigningAccountName="$ACCOUNT" \
              -c.win.azureSignOptions.certificateProfileName="$PROFILE" \
              -c.win.azureSignOptions.publisherName="$PUBLISHER"
          else
            echo "::notice::Azure signing variables not set; building an unsigned installer."
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --win --x64 --publish never
          fi

      - name: Check the signature
        if: vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem release\*.exe, release\win-unpacked\Trailmix.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') { Write-Error "$($f.Name): signature $($sig.Status)"; exit 1 }
            Write-Host "$($f.Name): signed by $($sig.SignerCertificate.Subject)"
          }

      # electron-builder's own publishing uploads files in parallel and can create two
      # drafts for one tag, so create (or reuse) the draft once and upload in sequence.
      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"$tag\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" -f name="${tag#v}" -F draft=true --jq .id)
          fi
          for f in release/latest.yml release/*.exe release/*.exe.blockmap; do
            # electron-builder names the file "Trailmix Setup x.exe" but latest.yml expects
            # dashes (and URLs can't hold spaces), so upload it as "Trailmix-Setup-x.exe".
            name=$(basename "$f" | tr ' ' '-')
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq ".[] | select(.name==\"$name\") | .id")
            [ -n "$old" ] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$name" --input "$f" --silent
            echo "uploaded $name"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Trailmix-windows
          path: release/*.exe
          if-no-files-found: error
