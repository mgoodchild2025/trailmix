name: Windows build

# Run on demand (Actions tab → Windows build → Run workflow) to get a test installer as a
# build artifact. On a version tag like v0.2.0 it also uploads the installer and update
# metadata to the draft GitHub Release for that version (see README → Releasing).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1
          fi

      # Optional code signing: add WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD
      # as repository secrets. Without them the installer is built unsigned.
      - name: Configure signing
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::notice::No WIN_CSC_LINK secret; building an unsigned installer."
          fi

      - name: Build installer
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build && npx electron-builder --win --x64 --publish never

      # electron-builder's own publishing uploads files in parallel and can create two
      # drafts for one tag, so create (or reuse) the draft once and upload in sequence.
      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"$tag\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" -f name="${tag#v}" -F draft=true --jq .id)
          fi
          for f in release/latest.yml release/*.exe release/*.exe.blockmap; do
            name=$(basename "$f")
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq ".[] | select(.name==\"$name\") | .id")
            [ -n "$old" ] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$name" --input "$f" --silent
            echo "uploaded $name"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Trailmix-windows
          path: release/*.exe
          if-no-files-found: error
