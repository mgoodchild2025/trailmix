name: Windows build

# Run on demand (Actions tab → Windows build → Run workflow) to get a test installer as a
# build artifact. On a version tag like v0.2.0 it also uploads the installer and update
# metadata to the draft GitHub Release for that version (see README → Releasing).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # lets azure/login sign in with OIDC

jobs:
  build:
    runs-on: windows-latest
    # The Azure federated credential trusts this environment, not a branch or tag.
    environment: release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      # Meeting detection helper: asks the Windows audio system which apps are capturing
      # from a microphone (native/win/micwatch.cpp). Bundled as resources/trailmix-micwatch.exe.
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Build meeting detection helper
        shell: cmd
        run: |
          mkdir build\bin 2>nul
          cl /nologo /O2 /EHsc /std:c++17 /DUNICODE /D_UNICODE native\win\micwatch.cpp /Fe:build\bin\trailmix-micwatch.exe /Fo:build\ ole32.lib

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1
          fi

      # Code signing with Azure Artifact Signing (formerly Trusted Signing). GitHub signs in
      # to Azure with a federated credential (OIDC) on the "release" environment, so no
      # secret is stored here. Set these repository variables to turn it on:
      #   AZURE_TENANT_ID, AZURE_CLIENT_ID   the app registration
      #   AZURE_SIGNING_ENDPOINT       e.g. https://eus.codesigning.azure.net/
      #   AZURE_SIGNING_ACCOUNT        the Artifact Signing account name
      #   AZURE_SIGNING_PROFILE        the certificate profile name
      #   AZURE_SIGNING_PUBLISHER      the certificate's subject CN; installed apps only
      #                                accept updates signed with this name
      # Without them the installer is built unsigned.
      - name: Sign in to Azure
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The app only holds the signer role on the signing account, which az doesn't
          # count as access to the subscription; signing just needs the token.
          allow-no-subscriptions: true

      # electron-builder signs the app's own executables, not extra files; sign the helper.
      - name: Sign meeting detection helper
        if: vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          Install-Module -Name TrustedSigning -MinimumVersion 0.5.0 -Force -Repository PSGallery -Scope CurrentUser
          Invoke-TrustedSigning -Endpoint $env:ENDPOINT -CodeSigningAccountName $env:ACCOUNT -CertificateProfileName $env:PROFILE `
            -FileDigest SHA256 -TimestampRfc3161 'http://timestamp.acs.microsoft.com' -TimestampDigest SHA256 `
            -Files (Resolve-Path build\bin\trailmix-micwatch.exe).Path

      - name: Build installer
        shell: bash
        env:
          SIGN: ${{ vars.AZURE_CLIENT_ID != '' }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          npm run build
          if [ "$SIGN" = "true" ]; then
            npx electron-builder --win --x64 --publish never \
              -c.win.azureSignOptions.endpoint="$ENDPOINT" \
              -c.win.azureSignOptions.codeSigningAccountName="$ACCOUNT" \
              -c.win.azureSignOptions.certificateProfileName="$PROFILE" \
              -c.win.azureSignOptions.publisherName="$PUBLISHER"
          else
            echo "::notice::Azure signing variables not set; building an unsigned installer."
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --win --x64 --publish never
          fi

      - name: Check the signature
        if: vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem release\*.exe, release\win-unpacked\Trailmix.exe, release\win-unpacked\resources\trailmix-micwatch.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') { Write-Error "$($f.Name): signature $($sig.Status)"; exit 1 }
            Write-Host "$($f.Name): signed by $($sig.SignerCertificate.Subject)"
          }

      # Start the packaged app for a few seconds and check the tray, meeting detection and
      # open-at-login came up (none of that is covered by the unit tests).
      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'trailmix-smoke'
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $env:TRAILMIX_DATA_DIR = $data
          $env:TRAILMIX_SMOKE_OUT = $out
          $p = Start-Process -FilePath 'release\win-unpacked\Trailmix.exe' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error 'Trailmix did not finish the smoke test in 60 s'; exit 1 }
          if (Test-Path "$data\logs\main.log") { Get-Content "$data\logs\main.log" }
          if (-not (Test-Path $out)) { Write-Error 'No smoke report was written'; exit 1 }
          $r = Get-Content $out -Raw
          Write-Host $r
          $j = $r | ConvertFrom-Json
          if (-not $j.tray -or -not $j.detection -or $j.micReports -lt 1 -or $j.errors.Count -gt 0) { Write-Error 'Smoke test failed (see report above)'; exit 1 }

      # electron-builder's own publishing uploads files in parallel and can create two
      # drafts for one tag, so create (or reuse) the draft once and upload in sequence.
      - name: Upload to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"$tag\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" -f name="${tag#v}" -F draft=true --jq .id)
          fi
          for f in release/latest.yml release/*.exe release/*.exe.blockmap; do
            # electron-builder names the file "Trailmix Setup x.exe" but latest.yml expects
            # dashes (and URLs can't hold spaces), so upload it as "Trailmix-Setup-x.exe".
            name=$(basename "$f" | tr ' ' '-')
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq ".[] | select(.name==\"$name\") | .id")
            [ -n "$old" ] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$name" --input "$f" --silent
            echo "uploaded $name"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Trailmix-windows
          path: release/*.exe
          if-no-files-found: error
